name: Update Market Data

on:
  schedule:
    - cron: "23 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate market data
        run: uv run main.py

      - name: Validate market data
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from config import REGIONS, MARKETS

          validated = 0

          for region in REGIONS:
              for ruleset in MARKETS:
                  for faction in MARKETS[ruleset]:

                      path = (
                          Path("docs/markets")
                          / region
                          / ruleset
                          / f"{faction}.json"
                      )

                      if not path.exists():
                          raise RuntimeError(
                              f"Missing market file: {path}"
                          )

                      data = json.loads(
                          path.read_text(encoding="utf-8")
                      )

                      if not data.get("last_updated"):
                          raise RuntimeError(
                              f"Missing timestamp: {path}"
                          )

                      datetime.fromisoformat(data["last_updated"])

                      if not isinstance(data.get("recipes"), list):
                          raise RuntimeError(
                              f"Invalid recipes: {path}"
                          )

                      if (
                          data.get("region") != region
                          or data.get("ruleset") != ruleset
                          or data.get("faction") != faction
                      ):
                          raise RuntimeError(
                              f"Invalid market metadata: {path}"
                          )

                      validated += 1

                      print(
                          f"Validated: {path} "
                          f"({len(data['recipes'])} recipes)"
                      )

          print(f"\nSuccessfully validated {validated} markets.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
